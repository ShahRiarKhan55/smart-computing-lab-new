<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — Smart Computing Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>

  <!-- ===================== NAVIGATION ===================== -->
  <nav class="nav">
    <div class="nav__logo"><a href="index.html">SCL<span>_</span></a></div>
    <ul class="nav__links" id="navLinks">
      <li><a href="index.html"              >Home</a></li>
      <li><a href="pages/research.html"     >Research</a></li>
      <li><a href="pages/team.html"         >Team</a></li>
      <li><a href="pages/publications.html" >Publications</a></li>
      <li><a href="pages/news.html"         >News</a></li>
      <li><a href="pages/contact.html"      >Contact</a></li>
    </ul>
    <button class="nav__hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </nav>


  <!-- ===================== PAGE BANNER ===================== -->
  <div class="page-banner">
    <div class="page-banner__inner">
      <p class="page-banner__tag" id="loggedInAs">/ my account</p>
      <h1 class="page-banner__title">My Profile</h1>
      <p class="page-banner__desc">Update how you appear on the public Team page.</p>
    </div>
  </div>


  <!-- ===================== PROFILE FORM ===================== -->
  <main class="container" style="max-width: 640px;">
    <div id="profileMessages"></div>
    <div id="profileContent">
      <p style="color: var(--muted); font-size: 14px;">Loading…</p>
    </div>
  </main>


  <!-- ===================== FOOTER ===================== -->
  <footer class="footer">
    <div class="footer__inner">
      <div class="footer__logo">Smart Computing Lab</div>
      <ul class="footer__links">
        <li><a href="pages/research.html">Research</a></li>
        <li><a href="pages/team.html">Team</a></li>
        <li><a href="pages/publications.html">Publications</a></li>
        <li><a href="pages/contact.html">Contact</a></li>
      </ul>
      <div class="footer__copy">© 2026 Smart Computing Lab. All rights reserved.</div>
    </div>
  </footer>

  <script src="js/app.js" data-base="."></script>
  <script>
    let profile = null;

    async function init() {
      // Wait for session check to finish before deciding what to show.
      document.addEventListener('scl:session-ready', onSessionReady, { once: true });
    }

    async function onSessionReady() {
      const user = window.SCL.user;
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('loggedInAs').textContent = `/ logged in as ${user.email}`;

      try {
        profile = await window.SCL.api('profile.php');
        renderForm();
      } catch (err) {
        document.getElementById('profileContent').innerHTML = `<p style="color: var(--muted);">${window.SCL.escapeHtml(err.message)}</p>`;
      }
    }

    function renderForm() {
      const esc = window.SCL.escapeHtml;
      document.getElementById('profileContent').innerHTML = `
        <form id="profileForm" class="contact-form">
          <div class="form-row">
            <div class="form-group">
              <label>Full name</label>
              <input type="text" id="f_name" value="${esc(profile.name)}" required />
            </div>
            <div class="form-group">
              <label>Initials (shown on avatar)</label>
              <input type="text" id="f_initials" value="${esc(profile.initials)}" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Role / title</label>
              <input type="text" id="f_role" value="${esc(profile.role)}" required />
            </div>
            <div class="form-group">
              <label>Department / focus area</label>
              <input type="text" id="f_department" value="${esc(profile.department)}" />
            </div>
          </div>
          <div class="form-group">
            <label>Short bio</label>
            <textarea id="f_bio">${esc(profile.bio)}</textarea>
          </div>
          <div class="form-group">
            <label>Photo URL (optional — leave blank to show initials)</label>
            <input type="text" id="f_photoUrl" value="${esc(profile.photoUrl)}" placeholder="https://..." />
          </div>
          <p style="font-size:12px; color: var(--muted); margin-bottom: 1rem;">
            Your category (Faculty / PhD / MSc / BSc / Research) can only be changed by the admin.
          </p>
          <button class="btn btn--primary form-submit" type="submit" id="saveBtn">Save changes</button>
        </form>
      `;

      document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const saveBtn = document.getElementById('saveBtn');
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving…';
        document.getElementById('profileMessages').innerHTML = '';

        const payload = {
          name: document.getElementById('f_name').value,
          initials: document.getElementById('f_initials').value,
          role: document.getElementById('f_role').value,
          department: document.getElementById('f_department').value,
          bio: document.getElementById('f_bio').value,
          photoUrl: document.getElementById('f_photoUrl').value,
        };

        try {
          profile = await window.SCL.api('profile.php', { method: 'PUT', body: JSON.stringify(payload) });
          document.getElementById('profileMessages').innerHTML = '<div class="form-success">Profile updated.</div>';
        } catch (err) {
          document.getElementById('profileMessages').innerHTML = `<div class="form-error">${window.SCL.escapeHtml(err.message)}</div>`;
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save changes';
        }
      });
    }

    init();
  </script>

</body>
</html>
